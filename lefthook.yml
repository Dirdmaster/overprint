pre-commit:
  commands:
    vue-format:
      root: apps/web/
      glob: "apps/web/**/*.vue"
      run: bunx --no-install prettier --check {staged_files}

pre-push:
  commands:
    quality:
      use_stdin: true
      run: python3 scripts/check_branch.py --push && bun run typecheck && bun run test:server && bun run test:ops
