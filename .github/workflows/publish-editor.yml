name: Publish editor to npm

on:
  push:
    tags: ['editor-v*']

permissions:
  contents: read

concurrency:
  group: publish-editor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Validate release tag and select npm channel
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/editor-release.mjs >> "$GITHUB_OUTPUT"
      - run: node --test scripts/editor-release.test.mjs
      - run: npm install --global npm@11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/editor build
      - run: bunx --no-install playwright install --with-deps chromium
        working-directory: packages/editor
      - run: bun run --cwd packages/editor test
      - name: Publish with npm trusted publishing
        working-directory: packages/editor
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.channel }}
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
