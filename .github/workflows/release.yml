name: Draft release

on:
  push:
    tags: ['v*', 'kicad-v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      release_tag: ${{ github.ref_name }}

  draft:
    name: Create draft release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: release-assets
      - name: Verify release checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Create a draft for review
        run: |
          flags=()
          version_tag="${RELEASE_TAG#kicad-}"
          if [[ "$version_tag" == *-* ]]; then flags+=(--prerelease); fi
          if [[ -f release-assets/RELEASE-NOTES.md ]]; then
            flags+=(--notes-file release-assets/RELEASE-NOTES.md)
          else
            flags+=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "$RELEASE_TAG" "${flags[@]}"
