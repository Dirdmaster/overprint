name: Release PR

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: changesets-main
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Use only the latest verified main revision
        id: source
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" == "$VERIFIED_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main revision exists; its CI run will prepare the release PR.'
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.source.outputs.current == 'true'
        with:
          node-version: '22.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.source.outputs.current == 'true'
        with:
          bun-version: '1.3.14'
      - name: Install pinned tooling
        if: steps.source.outputs.current == 'true'
        run: bun install --frozen-lockfile
      - name: Prepare versions and changelogs
        id: prepare
        if: steps.source.outputs.current == 'true'
        run: bash scripts/prepare-release-pr.sh
      - name: Maintain the release PR
        id: release
        if: steps.source.outputs.current == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: chore/release-versions
          base: main
          commit-message: 'chore(release): update versions and changelogs'
          title: 'chore(release): update versions and changelogs'
          body: |
            Combines reviewed changesets into package changelogs and independent versions.

            Review the changelogs, KiCad metadata, and required CI checks before merging.
            After merge, a maintainer reviews the artifacts and tags each approved release
            as described in docs/release.md. Web and KiCad tags create verified GitHub
            drafts. Editor tags publish to npm after the editor checks pass.
          add-paths: ${{ steps.prepare.outputs.paths }}
      - name: Run required CI on the generated PR
        if: steps.release.outputs.pull-request-number != '' && steps.release.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # GITHUB_TOKEN pushes do not emit a new pull_request workflow run.
        # workflow_dispatch explicitly starts the existing checks on this branch.
        run: gh workflow run ci.yml --ref chore/release-versions
