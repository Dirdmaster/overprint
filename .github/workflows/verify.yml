name: Verify

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  web:
    name: Web and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check branch naming
        if: github.event_name == 'pull_request' || github.ref_type == 'branch'
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/check_branch.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - name: Check contributor release notes
        if: >-
          github.event_name == 'pull_request' &&
          !(github.head_ref == 'chore/release-versions' &&
            github.event.pull_request.user.login == 'github-actions[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run changeset status --since "$BASE_SHA"
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test:server
      - run: bun run test:ops
      - name: Check plugin Python syntax
        run: python3 -m compileall -q packages/kicad/overprint_export
      - run: bunx --no-install playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run test
      - name: Prepare committed source and versioned plugin assets
        run: python3 scripts/prepare_release.py --directory "$RUNNER_TEMP/candidate" --tag "$RELEASE_TAG"
      - name: Build clean source with its matching source download
        working-directory: ${{ runner.temp }}/candidate/overprint
        run: |
          bun install --frozen-lockfile
          bun run build:cloudflare
          bun run test:standalone
          bun run test:cloudflare
      - name: Save tested Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/overprint/apps/web/.output/cloudflare
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/assets
          if-no-files-found: error
          retention-days: 14
      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures-${{ github.sha }}
          path: apps/web/test-results
          retention-days: 7
